<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Petrichor Audio Synthesizer</title>

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1013">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #06080a;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Industrial Test-Bench Chassis */
    .headunit-frame {
      position: relative;
      width: 96vw;
      max-width: 920px;
      height: 90vh;
      max-height: 540px;
      background: linear-gradient(180deg, #242b32 0%, #14181c 100%);
      border: 4px solid #3a4550;
      border-radius: 10px;
      box-shadow: 
        0 0 0 2px #0a0c0e,
        0 25px 60px rgba(0, 0, 0, 0.95),
        inset 0 2px 4px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 18px;
      gap: 14px;
    }

    /* Screws for Laboratory/Rackmount Aesthetics */
    .headunit-frame::before, .headunit-frame::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #0f1215;
      border: 1px solid #485665;
      border-radius: 50%;
    }
    .headunit-frame::before { top: 6px; left: 6px; }
    .headunit-frame::after { top: 6px; right: 6px; }

    /* Recessed CRT Glass Screen Area */
    .vfd-display {
      position: relative;
      flex: 1;
      background: #030805;
      border: 4px solid #101518;
      border-radius: 6px;
      box-shadow: 
        inset 0 0 35px rgba(0, 255, 102, 0.15),
        inset 0 0 20px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      overflow: hidden;
    }

    /* CRT Phosphor Scanline Texture Overlay */
    .vfd-display::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        rgba(0, 255, 102, 0) 60%, 
        rgba(0, 0, 0, 0.45) 40%
      );
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 5;
    }

    /* Top Section Grid Layout */
    .top-panel {
      display: flex;
      gap: 12px;
      height: 130px;
    }

    /* Oscilloscope Screen Box */
    .dot-matrix-container {
      flex: 1;
      background: #020a05;
      border: 2px solid #0d2818;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.2);
    }

    #dotMatrixCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Right Badge / Telemetry Panel */
    .status-badge-container {
      width: 200px;
      background: #020a05;
      border: 2px solid #0d2818;
      border-radius: 4px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .brand-title {
      font-weight: bold;
      color: #00ff66;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
      text-align: center;
      border-bottom: 1px solid #0d2818;
      padding-bottom: 6px;
      font-size: 11px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      color: #008833;
    }

    .status-item span.val {
      color: #00ff66;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
    }

    /* Bottom 24-Bar Spectrum Analyzer */
    .spectrum-container {
      flex: 1;
      background: #020a05;
      border: 2px solid #0d2818;
      border-radius: 4px;
      position: relative;
      box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.1);
    }

    #spectrumCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #14181c;
      border: 1px solid #2b353e;
      border-radius: 6px;
      padding: 8px 12px;
      z-index: 10;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: #1f262d;
      color: #00bb44;
      border: 1px solid #323e4a;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .btn:hover, .btn.active {
      background: #2b353e;
      color: #00ff66;
      border-color: #00ff66;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }

    /* Start Overlay */
    #startOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 8, 5, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      cursor: pointer;
    }

    .start-msg {
      border: 2px solid #00ff66;
      color: #00ff66;
      background: #020f06;
      padding: 16px 28px;
      border-radius: 6px;
      font-size: 13px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.9);
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);
      animation: pulse 1.8s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.75; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }
  </style>
</head>
<body>

  <div class="headunit-frame">
    <div class="vfd-display">
      
      <!-- Top Section -->
      <div class="top-panel">
        <div class="dot-matrix-container">
          <canvas id="dotMatrixCanvas" width="480" height="130"></canvas>
        </div>
        
        <div class="status-badge-container">
          <div class="brand-title">PETRICHOR SYNTH</div>
          <div class="status-item"><span>MODEL:</span> <span class="val">PAS-100</span></div>
          <div class="status-item"><span>SCOPE:</span> <span class="val" id="scopeMode">BOOTING</span></div>
          <div class="status-item"><span>GAIN:</span> <span class="val" id="gainVal">1.8x</span></div>
          <div class="status-item"><span>STATUS:</span> <span class="val">ACTIVE</span></div>
        </div>
      </div>

      <!-- Bottom Spectrum Analyzer -->
      <div class="spectrum-container">
        <canvas id="spectrumCanvas" width="800" height="300"></canvas>
      </div>

      <!-- Start Overlay -->
      <div id="startOverlay">
        <div class="start-msg">TAP TO START AUDIO INPUT</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
      <div class="btn-group">
        <button class="btn active" id="modeOsc">OSCILLOSCOPE WAVES</button>
      </div>
      <div class="btn-group">
        <button class="btn" id="gainLow">GAIN: LOW</button>
        <button class="btn active" id="gainNorm">GAIN: NORM</button>
        <button class="btn" id="gainHigh">GAIN: HIGH</button>
      </div>
    </div>
  </div>

  <script>
    const NUM_BARS = 24;
    let micGain = 1.8;
    
    // Oscilloscope & Radar CRT Palette
    const CRT_PALETTE = {
      bg: '#020a05',
      grid: '#082212',
      trace: '#00ff66',
      traceDim: '#008833',
      traceBright: '#ffffff',
      peak: '#ffaa00'
    };

    const dotCanvas = document.getElementById('dotMatrixCanvas');
    const dotCtx = dotCanvas.getContext('2d');
    const specCanvas = document.getElementById('spectrumCanvas');
    const specCtx = specCanvas.getContext('2d');
    const overlay = document.getElementById('startOverlay');
    const scopeModeElem = document.getElementById('scopeMode');

    let audioCtx, analyser, micStream;
    let frequencyBands = [];
    let barLevels = new Float32Array(NUM_BARS);
    let barPeaks = new Float32Array(NUM_BARS);
    let barVelocities = new Float32Array(NUM_BARS);

    // Boot Engine States: 0 = Terminal Boot (~5s), 1 = Oscilloscope Waveform Mode
    let isBooted = false;
    let bootFrame = 0;

    async function initAudio() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micStream = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        micStream.connect(analyser);

        setupBands();
        overlay.style.display = 'none';
        draw();
      } catch (err) {
        alert('Microphone access is required for audio visualization.');
      }
    }

    function setupBands() {
      const nyquist = audioCtx.sampleRate / 2;
      const minLog = Math.log10(31);
      const maxLog = Math.log10(16000);
      
      for (let i = 0; i < NUM_BARS; i++) {
        const logFreq = minLog + (i / (NUM_BARS - 1)) * (maxLog - minLog);
        const freq = Math.pow(10, logFreq);
        const index = Math.round(freq / (nyquist / (analyser.fftSize / 2)));
        frequencyBands.push(Math.max(1, index));
      }
    }

    // --- Draw Oscilloscope Grid ---
    function drawScopeGrid() {
      const w = dotCanvas.width;
      const h = dotCanvas.height;
      dotCtx.fillStyle = CRT_PALETTE.bg;
      dotCtx.fillRect(0, 0, w, h);

      dotCtx.strokeStyle = CRT_PALETTE.grid;
      dotCtx.lineWidth = 1;

      // Draw Grid Lines
      for (let x = 0; x < w; x += 30) {
        dotCtx.beginPath();
        dotCtx.moveTo(x, 0);
        dotCtx.lineTo(x, h);
        dotCtx.stroke();
      }
      for (let y = 0; y < h; y += 20) {
        dotCtx.beginPath();
        dotCtx.moveTo(0, y);
        dotCtx.lineTo(w, y);
        dotCtx.stroke();
      }
    }

    // --- Render Terminal Boot or Oscilloscope ---
    function renderUpperScreen(timeData) {
      const w = dotCanvas.width;
      const h = dotCanvas.height;

      if (!isBooted) {
        bootFrame++;
        dotCtx.fillStyle = CRT_PALETTE.bg;
        dotCtx.fillRect(0, 0, w, h);

        dotCtx.fillStyle = CRT_PALETTE.trace;
        dotCtx.font = '14px "Courier New", monospace';
        dotCtx.shadowColor = CRT_PALETTE.trace;
        dotCtx.shadowBlur = 6;

        // Terminal text appearing over ~5 seconds (approx 300 frames at 60fps)
        if (bootFrame > 20) dotCtx.fillText("PETRICHOR AUDIO SYNTHESIZER v1.0", 20, 30);
        if (bootFrame > 80) dotCtx.fillText("INITIALIZING OSCILLATORS... OK", 20, 55);
        if (bootFrame > 150) dotCtx.fillText("CALIBRATING CRT PHOSPHOR... OK", 20, 80);
        if (bootFrame > 220) dotCtx.fillText("SYSTEM READY. OSCILLOSCOPE ACTIVE.", 20, 105);

        dotCtx.shadowBlur = 0;

        if (bootFrame > 300) {
          isBooted = true;
          scopeModeElem.textContent = "OSCILL";
        }
        return;
      }

      // Live Oscilloscope Waveforms
      drawScopeGrid();

      dotCtx.shadowColor = CRT_PALETTE.trace;
      dotCtx.shadowBlur = 8;
      dotCtx.strokeStyle = CRT_PALETTE.trace;
      dotCtx.lineWidth = 2;
      dotCtx.beginPath();

      const sliceWidth = w / timeData.length;
      let x = 0;

      for (let i = 0; i < timeData.length; i++) {
        const v = (timeData[i] / 128.0) * micGain;
        const y = (v * h) / 2;

        if (i === 0) dotCtx.moveTo(x, y);
        else dotCtx.lineTo(x, y);

        x += sliceWidth;
      }

      dotCtx.stroke();
      dotCtx.shadowBlur = 0;
    }

    // --- Main Render Loop ---
    function draw() {
      // Frequency Data for Bottom Spectrum
      const freqArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(freqArray);

      // Time Domain Data for Upper Oscilloscope
      const timeArray = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(timeArray);

      renderUpperScreen(timeArray);

      // Render Bottom Spectrum Analyzer
      specCtx.clearRect(0, 0, specCanvas.width, specCanvas.height);
      const w = specCanvas.width;
      const h = specCanvas.height;

      // Draw Grid on Spectrum Background
      specCtx.strokeStyle = CRT_PALETTE.grid;
      specCtx.lineWidth = 1;
      for (let y = 0; y < h; y += 25) {
        specCtx.beginPath();
        specCtx.moveTo(0, y);
        specCtx.lineTo(w, y);
        specCtx.stroke();
      }

      const barSpacing = w / NUM_BARS;
      const barWidth = barSpacing * 0.72;
      const numSegments = 22;
      const segHeight = (h - 20) / numSegments;

      for (let i = 0; i < NUM_BARS; i++) {
        const fftIdx = frequencyBands[i];
        let rawVal = (freqArray[fftIdx] / 255) * micGain;
        rawVal = Math.min(1.0, Math.max(0.0, rawVal));

        barLevels[i] = rawVal;

        if (barLevels[i] > barPeaks[i]) {
          barPeaks[i] = barLevels[i];
          barVelocities[i] = 0;
        } else {
          barVelocities[i] += 0.002;
          barPeaks[i] -= barVelocities[i];
          if (barPeaks[i] < 0) barPeaks[i] = 0;
        }

        const activeSegs = Math.floor(barLevels[i] * numSegments);
        const x = i * barSpacing + (barSpacing - barWidth) / 2;

        for (let s = 0; s < numSegments; s++) {
          const y = h - (s + 1) * segHeight;

          if (s < activeSegs) {
            const ratio = s / numSegments;
            specCtx.fillStyle = ratio > 0.88 ? CRT_PALETTE.peak : CRT_PALETTE.trace;
            specCtx.shadowColor = CRT_PALETTE.trace;
            specCtx.shadowBlur = 4;
          } else {
            specCtx.fillStyle = '#05180c';
            specCtx.shadowBlur = 0;
          }

          specCtx.fillRect(x, y + 2, barWidth, segHeight - 3);
        }

        // Peak Indicators
        if (barPeaks[i] > 0.02) {
          const peakSeg = Math.floor(barPeaks[i] * numSegments);
          const peakY = h - (peakSeg + 1) * segHeight;
          specCtx.fillStyle = CRT_PALETTE.peak;
          specCtx.shadowColor = CRT_PALETTE.peak;
          specCtx.shadowBlur = 6;
          specCtx.fillRect(x, peakY + 2, barWidth, 3);
        }
      }

      requestAnimationFrame(draw);
    }

    overlay.addEventListener('click', initAudio);

    document.getElementById('gainLow').addEventListener('click', (e) => {
      micGain = 1.0;
      document.getElementById('gainVal').textContent = '1.0x';
      setActiveBtn(e.target);
    });
    document.getElementById('gainNorm').addEventListener('click', (e) => {
      micGain = 1.8;
      document.getElementById('gainVal').textContent = '1.8x';
      setActiveBtn(e.target);
    });
    document.getElementById('gainHigh').addEventListener('click', (e) => {
      micGain = 2.8;
      document.getElementById('gainVal').textContent = '2.8x';
      setActiveBtn(e.target);
    });

    function setActiveBtn(btn) {
      btn.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
