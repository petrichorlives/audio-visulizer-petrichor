<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pioneer VFD OEL Spectrum Analyzer</title>

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e1d1a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0d0c0b;
      color: #dddded;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Heavy Physical Tech Chassis */
    .headunit-frame {
      position: relative;
      width: 96vw;
      max-width: 920px;
      height: 90vh;
      max-height: 540px;
      background: linear-gradient(180deg, #3f3c37 0%, #21201d 100%);
      border: 4px solid #9c8562;
      border-radius: 10px;
      box-shadow: 
        0 0 0 3px #181715,
        0 25px 60px rgba(0, 0, 0, 0.95),
        inset 0 2px 4px rgba(246, 245, 244, 0.15);
      display: flex;
      flex-direction: column;
      padding: 18px;
      gap: 14px;
    }

    /* Screw Heads for Physical Hardware Detail */
    .headunit-frame::before, .headunit-frame::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #1e1d1a;
      border: 1px solid #9c8562;
      border-radius: 50%;
    }
    .headunit-frame::before { top: 6px; left: 6px; }
    .headunit-frame::after { top: 6px; right: 6px; }

    /* Recessed VFD Glass Display Container */
    .vfd-display {
      position: relative;
      flex: 1;
      background: #09090b;
      border: 4px solid #1c1b18;
      border-radius: 6px;
      box-shadow: 
        inset 0 0 25px rgba(0, 0, 0, 0.95),
        inset 0 2px 8px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      overflow: hidden;
    }

    /* VFD Glass Texture & Phosphor Glow Scanlines */
    .vfd-display::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        rgba(221, 221, 237, 0) 60%, 
        rgba(0, 0, 0, 0.4) 40%
      );
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 5;
    }

    /* Top Section Grid Layout */
    .top-panel {
      display: flex;
      gap: 12px;
      height: 120px;
    }

    /* 120x36 Dot Matrix Screen */
    .dot-matrix-container {
      flex: 1;
      background: #050507;
      border: 2px solid #23221e;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    #dotMatrixCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Right Status Badge Panel */
    .status-badge-container {
      width: 180px;
      background: #050507;
      border: 2px solid #23221e;
      border-radius: 4px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .brand-title {
      font-weight: bold;
      color: #f6f5f4;
      text-shadow: 0 0 8px rgba(198, 197, 227, 0.7);
      text-align: center;
      border-bottom: 1px solid #3f3c37;
      padding-bottom: 4px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      color: #88aa6e;
    }

    .status-item span.val {
      color: #dddded;
    }

    /* Bottom 24-Bar Spectrum Analyzer */
    .spectrum-container {
      flex: 1;
      background: #050507;
      border: 2px solid #23221e;
      border-radius: 4px;
      position: relative;
    }

    #spectrumCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181715;
      border: 1px solid #3f3c37;
      border-radius: 6px;
      padding: 8px 12px;
      z-index: 10;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: #252420;
      color: #88aa6e;
      border: 1px solid #3f3c37;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .btn:hover, .btn.active {
      background: #3f3c37;
      color: #f6f5f4;
      border-color: #9c8562;
      box-shadow: 0 0 8px rgba(156, 133, 98, 0.4);
    }

    /* Start Overlay */
    #startOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 9, 11, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      cursor: pointer;
    }

    .start-msg {
      border: 2px solid #9c8562;
      color: #f6f5f4;
      background: #1e1d1a;
      padding: 16px 28px;
      border-radius: 6px;
      font-size: 13px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(246, 245, 244, 0.6);
      box-shadow: 0 0 20px rgba(156, 133, 98, 0.3);
      animation: pulse 1.8s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.75; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }
  </style>
</head>
<body>

  <div class="headunit-frame">
    <div class="vfd-display">
      
      <!-- Top Section -->
      <div class="top-panel">
        <div class="dot-matrix-container">
          <canvas id="dotMatrixCanvas" width="240" height="72"></canvas>
        </div>
        
        <div class="status-badge-container">
          <div class="brand-title">PIONEER OEL</div>
          <div class="status-item"><span>DSP:</span> <span class="val">STUDIO</span></div>
          <div class="status-item"><span>MODE:</span> <span class="val">IBM POST</span></div>
          <div class="status-item"><span>PEAK:</span> <span class="val" id="peakVal">+3dB</span></div>
          <div class="status-item"><span>DISP:</span> <span class="val">SPECTRUM</span></div>
        </div>
      </div>

      <!-- Bottom Spectrum Analyzer -->
      <div class="spectrum-container">
        <canvas id="spectrumCanvas" width="800" height="300"></canvas>
      </div>

      <!-- Start Overlay -->
      <div id="startOverlay">
        <div class="start-msg">TAP TO START AUDIO INPUT</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
      <div class="btn-group">
        <button class="btn active" id="colorPalette">PALETTE: PALETTE VFD</button>
      </div>
      <div class="btn-group">
        <button class="btn" id="gainLow">GAIN: LOW</button>
        <button class="btn active" id="gainNorm">GAIN: NORM</button>
        <button class="btn" id="gainHigh">GAIN: HIGH</button>
      </div>
    </div>
  </div>

  <script>
    const NUM_BARS = 24;
    let micGain = 1.8;
    
    // User Provided Custom Palette
    const PALETTE = {
      c3F3C37: '#3F3C37', // Dark Grey Chassis
      c5E8054: '#5E8054', // Forest Green
      c514088: '#514088', // Deep Purple
      c654FA7: '#654FA7', // Bright Purple
      c9C8562: '#9C8562', // Tan Metallic Accent
      c88AA6E: '#88AA6E', // Sage Green
      c97C27E: '#97C27E', // Light Green
      cC6C5E3: '#C6C5E3', // Soft Lavender
      cDDDDED: '#DDDDED', // Ice White
      cF6F5F4: '#F6F5F4'  // Peak Bright White
    };

    const dotCanvas = document.getElementById('dotMatrixCanvas');
    const dotCtx = dotCanvas.getContext('2d');
    const specCanvas = document.getElementById('spectrumCanvas');
    const specCtx = specCanvas.getContext('2d');
    const overlay = document.getElementById('startOverlay');

    let audioCtx, analyser, micStream;
    let frequencyBands = [];
    let barLevels = new Float32Array(NUM_BARS);
    let barPeaks = new Float32Array(NUM_BARS);
    let barVelocities = new Float32Array(NUM_BARS);

    // Sequence States: 0: IBM BOOT, 1: PIONEER SHIELD, 2: SKULL, 3: CHILL DRIVE (PERMANENT)
    let seqState = 0;
    let seqFrame = 0;
    let driveX = 0;

    // Bitmap Font (5x7)
    const FONT_5X7 = {
      'I': [0x1F, 0x04, 0x04, 0x04, 0x04, 0x04, 0x1F],
      'B': [0x1E, 0x11, 0x11, 0x1E, 0x11, 0x11, 0x1E],
      'M': [0x11, 0x1B, 0x15, 0x11, 0x11, 0x11, 0x11],
      'P': [0x1E, 0x11, 0x11, 0x1E, 0x10, 0x10, 0x10],
      'O': [0x0E, 0x11, 0x11, 0x11, 0x11, 0x11, 0x0E],
      'S': [0x0F, 0x10, 0x10, 0x0E, 0x01, 0x01, 0x1E],
      'T': [0x1F, 0x04, 0x04, 0x04, 0x04, 0x04, 0x04],
      'E': [0x1F, 0x10, 0x10, 0x1E, 0x10, 0x10, 0x1F],
      'N': [0x11, 0x11, 0x19, 0x15, 0x13, 0x11, 0x11],
      'R': [0x1E, 0x11, 0x11, 0x1E, 0x14, 0x12, 0x11],
      'K': [0x11, 0x12, 0x14, 0x18, 0x14, 0x12, 0x11],
      ' ': [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
    };

    // Skull Bitmap
    const SKULL_16X16 = [
      0b0000011111100000,
      0b0001111111111000,
      0b0011111111111100,
      0b0111111111111110,
      0b0111001111001110,
      0b0111001111001110,
      0b0111111111111110,
      0b0011111001111100,
      0b0001110000111000,
      0b1000111111110001,
      0b1100010110100011,
      0b0110000110000110,
      0b0011000110001100,
      0b0001101111011000,
      0b0011000110001100,
      0b1100000000000011
    ];

    const SKYLINE = [3, 5, 5, 7, 10, 10, 10, 5, 3, 14, 14, 14, 7, 9, 9, 4, 16, 16, 5, 3, 7, 12, 12, 5];

    async function initAudio() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micStream = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        micStream.connect(analyser);

        setupBands();
        overlay.style.display = 'none';
        draw();
      } catch (err) {
        alert('Microphone access is required for audio visualization.');
      }
    }

    function setupBands() {
      const nyquist = audioCtx.sampleRate / 2;
      const minLog = Math.log10(31);
      const maxLog = Math.log10(16000);
      
      for (let i = 0; i < NUM_BARS; i++) {
        const logFreq = minLog + (i / (NUM_BARS - 1)) * (maxLog - minLog);
        const freq = Math.pow(10, logFreq);
        const index = Math.round(freq / (nyquist / (analyser.fftSize / 2)));
        frequencyBands.push(Math.max(1, index));
      }
    }

    function clearDots() {
      dotCtx.fillStyle = '#050507';
      dotCtx.fillRect(0, 0, dotCanvas.width, dotCanvas.height);
    }

    function drawDot(x, y, active = true, bright = false) {
      const dotSize = 1.5;
      const gap = 2;
      const px = x * gap + 2;
      const py = y * gap + 2;

      dotCtx.fillStyle = active 
        ? (bright ? PALETTE.cF6F5F4 : PALETTE.cDDDDED)
        : '#121216';
      dotCtx.fillRect(px, py, dotSize, dotSize);
    }

    function drawChar5x7(char, startX, startY) {
      const bmp = FONT_5X7[char];
      if (!bmp) return;
      for (let r = 0; r < 7; r++) {
        const row = bmp[r];
        for (let c = 0; c < 5; c++) {
          if ((row >> (4 - c)) & 1) {
            drawDot(startX + c, startY + r, true, true);
          }
        }
      }
    }

    function renderUpperMatrix(bassEnergy) {
      clearDots();
      seqFrame++;

      // 1. IBM Terminal Startup Sequence (Slow & Chill)
      if (seqState === 0) {
        const line1 = "IBM PC POST";
        const ramVal = Math.min(640, Math.floor(seqFrame * 6));
        
        for (let i = 0; i < line1.length; i++) {
          drawChar5x7(line1[i], 10 + (i * 6), 6);
        }

        // Draw RAM Counter
        const ramText = ramVal + "K OK";
        for (let i = 0; i < ramText.length; i++) {
          drawChar5x7(ramText[i], 10 + (i * 6), 18);
        }

        if (seqFrame > 140) {
          seqState = 1;
          seqFrame = 0;
        }
      }
      
      // 2. Pioneer Shield
      else if (seqState === 1) {
        const text = "PIONEER";
        for (let i = 0; i < text.length; i++) {
          drawChar5x7(text[i], 38 + (i * 6), 14);
        }
        
        if (seqFrame > 120) {
          seqState = 2;
          seqFrame = 0;
        }
      }

      // 3. Skull & Crossbones
      else if (seqState === 2) {
        const brightEyes = bassEnergy > 0.6;
        for (let r = 0; r < 16; r++) {
          for (let c = 0; c < 16; c++) {
            const bit = (SKULL_16X16[r] >> (15 - c)) & 1;
            if (bit) {
              const isEye = (r === 4 || r === 5) && (c === 4 || c === 5 || c === 10 || c === 11);
              drawDot(52 + c, 10 + r, true, isEye && brightEyes);
            }
          }
        }

        if (seqFrame > 140) {
          seqState = 3; // Permanent Chill Drive
        }
      }

      // 4. Chill Night Driving Loop
      else if (seqState === 3) {
        driveX += 0.15 + (bassEnergy * 0.15); // Slow, enjoyable scroll speed

        // Skyline
        for (let x = 0; x < 120; x++) {
          const skyIndex = Math.floor((x + driveX * 0.3) % SKYLINE.length);
          const height = SKYLINE[skyIndex];
          for (let y = 0; y < height; y++) {
            drawDot(x, 22 - y, true, false);
          }
        }

        // Horizon
        for (let x = 0; x < 120; x++) {
          drawDot(x, 23, true, true);
        }

        // Perspective Road Grid
        for (let y = 24; y < 36; y++) {
          const rowOffset = (y - 24);
          const roadWidth = 18 + (rowOffset * 8);
          const leftX = Math.floor(60 - roadWidth / 2);
          const rightX = Math.floor(60 + roadWidth / 2);

          drawDot(leftX, y, true, false);
          drawDot(rightX, y, true, false);

          if (Math.floor(y + driveX) % 5 === 0) {
            drawDot(60, y, true, true);
          }
        }
      }
    }

    function draw() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      let bassSum = 0;
      for (let i = 0; i < 8; i++) bassSum += dataArray[i];
      const bassEnergy = (bassSum / 8) / 255;

      renderUpperMatrix(bassEnergy);

      specCtx.clearRect(0, 0, specCanvas.width, specCanvas.height);
      const w = specCanvas.width;
      const h = specCanvas.height;
      const barSpacing = w / NUM_BARS;
      const barWidth = barSpacing * 0.75;
      const numSegments = 20;
      const segHeight = (h - 20) / numSegments;

      for (let i = 0; i < NUM_BARS; i++) {
        const fftIdx = frequencyBands[i];
        let rawVal = (dataArray[fftIdx] / 255) * micGain;
        rawVal = Math.min(1.0, Math.max(0.0, rawVal));

        barLevels[i] = rawVal;

        if (barLevels[i] > barPeaks[i]) {
          barPeaks[i] = barLevels[i];
          barVelocities[i] = 0;
        } else {
          barVelocities[i] += 0.002;
          barPeaks[i] -= barVelocities[i];
          if (barPeaks[i] < 0) barPeaks[i] = 0;
        }

        const activeSegs = Math.floor(barLevels[i] * numSegments);
        const x = i * barSpacing + (barSpacing - barWidth) / 2;

        for (let s = 0; s < numSegments; s++) {
          const y = h - (s + 1) * segHeight;

          if (s < activeSegs) {
            const ratio = s / numSegments;
            if (ratio > 0.85) specCtx.fillStyle = PALETTE.c97C27E;
            else if (ratio > 0.65) specCtx.fillStyle = PALETTE.c88AA6E;
            else if (ratio > 0.45) specCtx.fillStyle = PALETTE.c5E8054;
            else if (ratio > 0.25) specCtx.fillStyle = PALETTE.c654FA7;
            else specCtx.fillStyle = PALETTE.c514088;
          } else {
            specCtx.fillStyle = '#121216';
          }

          specCtx.fillRect(x, y + 2, barWidth, segHeight - 3);
        }

        if (barPeaks[i] > 0.02) {
          const peakSeg = Math.floor(barPeaks[i] * numSegments);
          const peakY = h - (peakSeg + 1) * segHeight;
          specCtx.fillStyle = PALETTE.cC6C5E3;
          specCtx.fillRect(x, peakY + 2, barWidth, 3);
        }
      }

      requestAnimationFrame(draw);
    }

    overlay.addEventListener('click', initAudio);

    document.getElementById('gainLow').addEventListener('click', (e) => {
      micGain = 1.0;
      setActiveBtn(e.target);
    });
    document.getElementById('gainNorm').addEventListener('click', (e) => {
      micGain = 1.8;
      setActiveBtn(e.target);
    });
    document.getElementById('gainHigh').addEventListener('click', (e) => {
      micGain = 2.8;
      setActiveBtn(e.target);
    });

    function setActiveBtn(btn) {
      btn.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
